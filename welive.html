<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Cinzel&display=swap" rel="stylesheet">
</head>
<style>
  body { margin: 0; background: #000; color: #fff; }

  footer {
    position: fixed;
    bottom: 5vmin;
    left: 0;
    right: 0;
    z-index: 2;
    font: 3.4vmin/1.25 "Cinzel", serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: center;
  }

  body > div {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    padding-bottom: 7vmin;
    font: 10.08vmin/1 "Boldonse", sans-serif;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    opacity: 0;
    animation: flash 12s step-end infinite;
    animation-delay: calc(var(--i) * .5s);
  }

  @keyframes flash {
    0%           { opacity: 1; }
    2.083%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    body > div { animation: none; }
    body > div:first-child { opacity: 1; }
  }
</style>

<footer>"We Live In…"<br>An Impermanent<br>Artist Statement</footer>
